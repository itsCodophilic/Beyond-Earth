<!doctype html>
<!-- Entry point for the interactive Beyond Earth experience. -->
<!--
  The page hosts the Three.js canvas, HUD overlays, scroll stages,
  and the loader while the universe assets initialize.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond Earth</title>
    <!-- Preconnect to remote servers used by Three.js textures and modules. -->
    <!-- <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://threejs.org" /> -->
    <!-- Main stylesheet for page layout, HUD, and effects. -->
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <!-- Loader overlay displayed while Three.js assets and textures initialize. -->
    <div id="loader" class="loader" aria-live="polite">
      <div class="loader__ring" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p>Bringing the universe to you</p>
    </div>

    <!-- Canvas element used by Three.js for rendering the 3D universe. -->
    <canvas id="universe" aria-label="Interactive animated 3D universe scene"></canvas>

    <!-- Scrollable interface content that shapes the camera journey. -->
    <main class="experience">
      <header class="hud" aria-label="Universe navigation">
        <!-- Brand and home anchor. -->
        <a class="brand" href="#voyage" aria-label="Beyond Earth">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__text">Beyond Earth</span>
        </a>

        <!-- Live labels updated from JavaScript as the user moves through the scene. -->
        <div class="readout" aria-live="polite">
          <span id="scale-label">Earth orbit</span>
          <strong id="body-label">Free drift</strong>
          <em id="body-detail">Eight-planet solar system</em>
        </div>

        <!-- Simple control hints for how to interact with the simulation. -->
        <div class="ship-controls" aria-label="Flight controls">
          <span>Scroll to change scale</span>
          <span>Drag to orbit</span>
          <span>Click a body to focus</span>
        </div>
      </header>

      <!-- First content stage introduces the Earth-scale starting point. -->
      <section class="stage" id="voyage">

      </section>


    </main>

    <!-- Progress bar reflects current scroll progress; updated by JavaScript. -->
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

    <!-- Main application script loaded as a module. -->
    <script type="module" defer src="./src/js/main.js"></script>
  </body>
</html>
