<!doctype html>
<!-- Entry point for the interactive Beyond Earth experience. -->
<!--
  The page hosts the Three.js canvas, HUD overlays, scroll stages,
  and the loader while the universe assets initialize.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond Earth</title>
    <!-- Preconnect to remote servers used by Three.js textures and modules. -->
    <!-- <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://threejs.org" /> -->
    <!-- Main stylesheet for page layout, HUD, and effects. -->
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <!-- Loader overlay displayed while Three.js assets and textures initialize. -->
    <!-- Contents are replaced by createIntroSequence(); this markup is only the
         first paint, shown before the module has executed. -->
    <div id="loader" class="intro" aria-live="polite"></div>

    <!-- Canvas element used by Three.js for rendering the 3D universe. -->
    <canvas id="universe" aria-label="Interactive animated 3D universe scene"></canvas>

    <!-- Scrollable interface content that shapes the camera journey. -->
    <main class="experience">
      <header class="hud" aria-label="Universe navigation">
        <!-- Cinematic project information trigger. -->
        <button
          class="brand"
          id="about-experience-trigger"
          type="button"
          aria-label="Open information about Beyond Earth"
          aria-haspopup="dialog"
          aria-controls="about-experience-panel"
        >
          <span class="brand__mark" aria-hidden="true">
            <span class="brand__orbit brand__orbit--outer"></span>
            <span class="brand__orbit brand__orbit--inner"></span>
            <span class="brand__planet"></span>
          </span>
          <span class="brand__copy">
            <span class="brand__kicker">Interstellar experience</span>
            <span class="brand__text">Beyond Earth</span>
          </span>
        </button>

        <!-- Primary invitation into the focused slow-motion inspection experience. -->
        <div class="ship-controls" aria-label="Celestial inspection guidance">
          <span>Click, Scroll and dive into the Universe</span>
        </div>
      </header>

      <!-- First content stage introduces the Earth-scale starting point. -->
      <section class="stage" id="voyage">

      </section>


    </main>

    <!--
      Selection panel populated from each celestial body's userData.info object.
      The connector is rotated by JavaScript so it points toward the selected mesh.
    -->
    <div id="body-connector" class="body-connector" aria-hidden="true"></div>
    <aside id="body-card" class="body-card" aria-live="polite" aria-hidden="true">
      <button id="card-close" class="body-card__close" type="button" aria-label="Close celestial information">×</button>
      <div class="body-card__eyebrow">
        <span id="card-type">Celestial body</span>
        <span id="card-mode">Inspection mode</span>
      </div>
      <h2 id="card-name">Earth</h2>
      <dl class="body-card__facts">
        <div><dt>Diameter</dt><dd id="card-diameter">—</dd></div>
        <div><dt>Orbital speed</dt><dd id="card-speed">—</dd></div>
        <div><dt>Distance from Earth</dt><dd id="card-distance">—</dd></div>
      </dl>
      <p id="card-description">Select a planet or satellite to inspect it.</p>
      <span id="card-hint" class="body-card__hint">Click to focus · Focus activates slow motion</span>
    </aside>

    <!-- Progress bar reflects current scroll progress; updated by JavaScript. -->
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

    <!--
      Diagnostic: foreground emulation.

      Browsers suspend requestAnimationFrame entirely in a background tab and
      clamp setTimeout to about a second, which makes the opening sequence
      impossible to capture or measure under automation -- the loop simply
      never runs. With ?raf=poll the frame clock is driven by MessageChannel,
      which is exempt from that throttling, and the visibility API is reported
      as visible so the application's own visibility-aware paths behave as they
      would on screen.

      This changes only WHEN frames are delivered, never their contents or
      their timing: the 60 FPS cadence gate downstream still works from
      performance.now(), so measurements taken this way remain comparable.
      Absent the query parameter this block does nothing at all.
    -->
    <script>
      if (new URLSearchParams(location.search).get("raf") === "poll") {
        (function () {
          const channel = new MessageChannel();
          const pending = new Map();
          let nextHandle = 1;
          channel.port1.onmessage = (event) => {
            const callback = pending.get(event.data);
            if (!callback) return;
            pending.delete(event.data);
            callback(performance.now());
          };
          window.requestAnimationFrame = (callback) => {
            const handle = nextHandle++;
            pending.set(handle, callback);
            channel.port2.postMessage(handle);
            return handle;
          };
          window.cancelAnimationFrame = (handle) => pending.delete(handle);
          Object.defineProperty(document, "hidden", { get: () => false });
          Object.defineProperty(document, "visibilityState", { get: () => "visible" });
        }());
      }
    </script>

    <!-- Main application script loaded as a module. -->
    <script type="module" defer src="./src/js/main.js"></script>
  </body>
</html>
